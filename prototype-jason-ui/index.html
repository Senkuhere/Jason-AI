<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jason AI Assistant</title>
    <link rel="icon" href="images/icons8-processor-96.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Include Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Conversation Area (Left Side / Mobile Bottom Panel) -->
        <aside class="sidebar chat-panel" id="chatPanel">
            <div class="chat-header" id="dragHeader">
                <div id="dragHandle" class="drag-handle" role="button" aria-label="Drag to expand or collapse"></div>
                <div class="chat-title">Chat</div>
            </div>

            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-avatar">J</div>
                    <div class="brand-info">
                        <span class="brand-title">Jason</span>
                        <span class="brand-subtitle">AI Interface</span>
                    </div>
                </div>
            </div>

            <!-- Messages Stream in Sidebar -->
            <div class="chat-messages" id="chatMessages">
                <div
                    id="typingIndicator"
                    class="typing-indicator"
                    hidden
                    aria-label="Jason is typing"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div id="processingStatus" aria-live="polite" class="visually-hidden"></div>

            <!-- Input Bar inside Sidebar -->
            <div class="chat-input-area">
                <div
                    id="imageAttachment"
                    class="image-attachment"
                    hidden
                >
                    <img
                        id="imagePreview"
                        class="image-preview"
                        alt="Selected image"
                    >

                    <button
                        id="removeImageButton"
                        class="remove-image-button"
                        type="button"
                        aria-label="Remove selected image"
                        title="Remove image"
                    >
                        ×
                    </button>
                </div>
                <div class="chat-input-wrapper">
                    <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" hidden>
                    <button class="attach-btn" id="imageButton" type="button" aria-label="Attach image" title="Attach image">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    <textarea id="chatInput" placeholder="Command Jason..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" aria-label="Send message">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <div class="input-footer-note">Cinematic holographic prototype, Sir.</div>
            </div>
        </aside>

        <!-- Center / Right Main Viewport with Three.js Holographic Globe -->
        <main class="main-viewport" id="viewport">
            <!-- Header overlay -->
            <header class="viewport-header">
                <div class="viewport-title">
                    <h2>Holographic Core</h2>
                    <span class="connection-status">
                        <span class="status-dot"></span> Active Simulation
                    </span>
                </div>
                <div class="viewport-actions">
                    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Switch Theme">
                        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Three.js Canvas Container -->
            <div id="globeContainer" class="globe-container">
                <div id="globeStateLabel" class="hud-state">IDLE</div>
                <!-- HUD Overlays -->
                <div class="hud-overlay hud-top-left">
                    <span class="hud-label">SYSTEM</span>
                    <span class="hud-value">JASON MATRIX V2</span>
                </div>
                <div class="hud-overlay hud-top-right">
                    <span class="hud-label">STATUS</span>
                    <span class="hud-value glow-text">ONLINE</span>
                </div>
                <div class="hud-overlay hud-bottom-left">
                    <span class="hud-label">CORE TEMP</span>
                    <span class="hud-value">34.2 °C</span>
                </div>
                <div class="hud-overlay hud-bottom-right">
                    <span class="hud-label">ENCRYPTION</span>
                    <span class="hud-value">SECURE-256</span>
                </div>
            </div>

            <!-- Bottom glow element inside viewport -->
            <div class="glow-bottom"></div>
        </main>
    </div>

    <script src="script.js"></script>

    <!-- Mobile Draggable Swipe Script with Smooth Physics -->
    <script>
    (function() {
      const panel = document.getElementById('chatPanel');
      const header = document.getElementById('dragHeader');
      const handle = document.getElementById('dragHandle');
      
      if (!panel || !header || !handle) return;

      const COLLAPSED_VISIBLE_PX = 50; // visible height when collapsed
      const SNAP_THRESHOLD = 0.35;  
      const TOP_GAP_PX = 48; // when fully expanded leave this many px visible at top so handle stays reachable

      let panelHeight = 0;
      let collapsedTranslate = 0;
      let expandedTranslate = 0;
      let startY = 0;
      let startTranslate = 0;
      let currentTranslate = 0;
      let dragging = false;
      let rafId = null;

      function recalc() {
        // If on desktop, clear any mobile transform and bail out.
        if (window.innerWidth >= 1080) {
          panel.style.transition = 'none';
          panel.style.transform = 'none';
          return;
        }

        panel.style.transition = 'none';
        panelHeight = Math.round(panel.getBoundingClientRect().height);
        const vh = window.innerHeight;
        // For a fixed bottom panel, translateY values are positive downward.
        collapsedTranslate = Math.max(0, panelHeight - COLLAPSED_VISIBLE_PX);
        expandedTranslate = Math.max(0, TOP_GAP_PX + panelHeight - vh);

        // Clamp currentTranslate to new bounds
        currentTranslate = Math.max(expandedTranslate, Math.min(collapsedTranslate, currentTranslate));
        panel.style.transform = `translateY(${currentTranslate}px)`;
      }

      function setInitialPosition() {
        panelHeight = Math.round(panel.getBoundingClientRect().height);

        // If desktop, ensure the sidebar is in its normal (desktop) position.
        if (window.innerWidth >= 1080) {
          currentTranslate = 0;
          panel.style.transform = 'none';
          return;
        }

        collapsedTranslate = Math.max(0, panelHeight - COLLAPSED_VISIBLE_PX);
        expandedTranslate = Math.max(0, TOP_GAP_PX + panelHeight - window.innerHeight);
        currentTranslate = collapsedTranslate;
        panel.style.transform = `translateY(${currentTranslate}px)`;
      }

      // Defer initial placement until first frame (fonts/layout settled)
      window.requestAnimationFrame(() => setInitialPosition());
      window.addEventListener('resize', () => setTimeout(recalc, 80));

      function onPointerDown(e) {
        if (window.innerWidth >= 1080) return;
        dragging = true;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startTranslate = currentTranslate;
        panel.style.transition = 'none'; 
        e.preventDefault();
      }

      function onPointerMove(e) {
        if (!dragging || window.innerWidth >= 1080) return;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const delta = clientY - startY;
        let next = startTranslate + delta;

        next = Math.max(expandedTranslate, Math.min(collapsedTranslate, next));
        currentTranslate = next;

        if (!rafId) {
          rafId = requestAnimationFrame(() => {
            panel.style.transform = `translateY(${currentTranslate}px)`;
            rafId = null;
          });
        }
      }

      function onPointerUp() {
        if (!dragging || window.innerWidth >= 1080) return;
        dragging = false;
        panel.style.transition = 'transform 320ms cubic-bezier(0.22, 0.9, 0.35, 1)'; 

        const range = collapsedTranslate - expandedTranslate;
        const progress = range > 1 ? (collapsedTranslate - currentTranslate) / range : 0;

        if (progress >= SNAP_THRESHOLD) {
          currentTranslate = expandedTranslate;
        } else {
          currentTranslate = collapsedTranslate;
        }

        panel.style.transform = `translateY(${currentTranslate}px)`;
      }

      header.addEventListener('touchstart', onPointerDown, { passive: false });
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', onPointerUp);

      header.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      handle.addEventListener('touchstart', (e) => { header.dispatchEvent(new TouchEvent('touchstart', {changedTouches: e.changedTouches})); }, {passive:false});
      handle.addEventListener('mousedown', (e) => { header.dispatchEvent(new MouseEvent('mousedown', e)); });

      // Watch for content/size changes so the panel stays correctly positioned
      const observer = new MutationObserver(() => {
        setTimeout(recalc, 40);
      });
      observer.observe(panel, { childList: true, subtree: true });
    })();
    </script>
</body>
</html>
